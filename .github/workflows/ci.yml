name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting for changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit available; skipping changed-file formatting check."
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.css' '*.md' '*.yml' '*.yaml')
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs pnpm exec prettier --check
          fi
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Pack UI library
        run: pnpm --filter @prismwave/ui pack --pack-destination "$RUNNER_TEMP"
      - name: Verify packed package in a consumer project
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/prismwave-ui-0.1.0.tgz
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install "$PACKAGE_TARBALL" react react-dom
          node --input-type=module -e "const ui = await import('@prismwave/ui'); if (!ui.Button || !ui.Card) throw new Error('Expected component exports are missing'); const tailwind = await import('@prismwave/ui/tailwind'); if (!tailwind.default) throw new Error('Tailwind preset export is missing'); console.log('Consumer package imports passed')"
          test -f node_modules/@prismwave/ui/dist/styles.css
